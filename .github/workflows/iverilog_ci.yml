name: Project-RISE High-Assurance Verification CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # =========================================================================
  # JOB 1: RTL Linting & Code Style Checks (Verilator)
  # =========================================================================
  rtl-lint:
    name: "1. RTL Static Analysis & Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Run Verilator Lint (Strict Mode)
        run: |
          echo "===> Running Verilator Lint Check..."
          verilator --lint-only -Wall -Wno-fatal hdl/project_rise_core.v

  # =========================================================================
  # JOB 2: Open Source RTL Synthesis Check (Yosys)
  # =========================================================================
  rtl-synthesis-check:
    name: "2. Hardware Synthesizability Check (Yosys)"
    runs-on: ubuntu-latest
    needs: rtl-lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Yosys Synthesis Tool
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys

      - name: Run Synthesis Check & Resource Estimation
        run: |
          echo "===> Running Yosys Open Synthesis..."
          yosys -p "read_verilog hdl/project_rise_core.v; synth_ice40 -top project_rise_core" > synth_report.log
          grep -A 15 "Printing statistics" synth_report.log || cat synth_report.log

  # =========================================================================
  # JOB 3: Verilog RTL Simulation & Waveform Generation
  # =========================================================================
  verilog-simulation:
    name: "3. RTL Simulation & Waveform Dump"
    runs-on: ubuntu-latest
    needs: rtl-lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog build-essential

      - name: Compile and Run Simulation
        run: |
          mkdir -p build
          FILES=$(find hdl sim -name "*.v")
          echo "Compiling RTL files: $FILES"
          iverilog -g2012 -o build/sim.vvp $FILES
          vvp build/sim.vvp

      - name: Upload Waveform Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vcd-simulation-waveform
          path: wave.vcd
          retention-days: 7

  # =========================================================================
  # JOB 4: C++ HAL Driver Build & Unit Tests
  # =========================================================================
  hal-driver-test:
    name: "4. C++ HAL Driver Verification"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Compiler & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Compile C++ HAL Driver
        run: |
          g++ -Wall -Wextra -Werror -std=c++17 hal/hardware_hal_v3.cpp -o hal_driver_test

      - name: Execute HAL Driver Sanity Test
        run: |
          ./hal_driver_test
